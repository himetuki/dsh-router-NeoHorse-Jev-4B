# dsh bundle patch: inserts this plugin's row into a profile's layer stack.
#
# The judge is a remote TokenRhythm System One call (NeoHorse-Jev-4B); `auto: true` turns on
# per-turn tier routing. The API key is resolved by reference (`credentialRef`) through DSH's
# credentials service -- this plugin never reads the key itself.
- insert:
    - id: router-neohorse
      name: 'dsh-router-neohorse'
      config:
        auto: true
        baseUrl: https://tokenrhythm.studio/v1/systemone
        model: NeoHorse-Jev-4B
        credentialRef: JEV_API_KEY
        timeoutMs: 30000
