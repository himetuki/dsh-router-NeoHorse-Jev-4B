name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install plugin test peers (schemastery + cosmokit)
        run: npm install --no-audit --no-fund
      - name: plugin tests (arm parsing, auto state machine, System One wire, judge contract)
        run: |
          node parseArm.test.mjs
          node auto.test.mjs
          node neohorse.test.mjs
          node contract.test.mjs
